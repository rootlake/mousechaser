<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Chaser Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        #chaser {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ff4757;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
            transition: transform 0.1s linear;
            transform: translate(-50%, -50%);
            border: 3px solid #fff;
        }

        #cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #2ed573;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.8);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 2px solid #fff;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(255, 71, 87, 0.5);
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4757;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #finalTime {
            font-size: 36px;
            color: #2ed573;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #restartBtn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #restartBtn:hover {
            background: #26d467;
        }

        #speedIndicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>Time: <span id="timer">0.00</span>s</div>
        </div>
        <div id="speedIndicator">
            Speed: <span id="speed">1.0</span>x
        </div>
        <div id="chaser"></div>
        <div id="cursor"></div>
        <div id="gameOver">
            <h1>Game Over!</h1>
            <p>You were caught!</p>
            <div id="finalTime">Time: <span id="finalTimeValue">0.00</span>s</div>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const chaser = document.getElementById('chaser');
        const cursor = document.getElementById('cursor');
        const gameContainer = document.getElementById('gameContainer');
        const gameOver = document.getElementById('gameOver');
        const timerDisplay = document.getElementById('timer');
        const finalTimeValue = document.getElementById('finalTimeValue');
        const speedDisplay = document.getElementById('speed');
        const restartBtn = document.getElementById('restartBtn');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let chaserX = 50;
        let chaserY = 50;
        let gameRunning = true;
        let startTime = Date.now();
        let baseSpeed = 0.5;
        let speedMultiplier = 1.0;
        let animationFrame;

        function updateTimer() {
            if (!gameRunning) return;
            const elapsed = (Date.now() - startTime) / 1000;
            timerDisplay.textContent = elapsed.toFixed(2);
            
            // Increase speed over time
            speedMultiplier = 1.0 + (elapsed / 10);
            speedDisplay.textContent = speedMultiplier.toFixed(2);
            
            requestAnimationFrame(updateTimer);
        }

        function checkCollision() {
            const chaserRect = chaser.getBoundingClientRect();
            const cursorRect = cursor.getBoundingClientRect();
            
            const distance = Math.sqrt(
                Math.pow(chaserRect.left + chaserRect.width / 2 - (cursorRect.left + cursorRect.width / 2), 2) +
                Math.pow(chaserRect.top + chaserRect.height / 2 - (cursorRect.top + cursorRect.height / 2), 2)
            );
            
            return distance < 30;
        }

        function updateChaser() {
            if (!gameRunning) return;

            const dx = mouseX - chaserX;
            const dy = mouseY - chaserY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > 0) {
                const speed = baseSpeed * speedMultiplier;
                chaserX += (dx / distance) * speed;
                chaserY += (dy / distance) * speed;
            }
            
            chaser.style.left = chaserX + 'px';
            chaser.style.top = chaserY + 'px';
            
            if (checkCollision()) {
                endGame();
            } else {
                animationFrame = requestAnimationFrame(updateChaser);
            }
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationFrame);
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            finalTimeValue.textContent = finalTime;
            gameOver.style.display = 'block';
        }

        function restartGame() {
            gameRunning = true;
            gameOver.style.display = 'none';
            chaserX = 50;
            chaserY = 50;
            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
            startTime = Date.now();
            speedMultiplier = 1.0;
            chaser.style.left = chaserX + 'px';
            chaser.style.top = chaserY + 'px';
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            updateTimer();
            updateChaser();
        }

        gameContainer.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        restartBtn.addEventListener('click', restartGame);

        // Initialize game
        chaser.style.left = chaserX + 'px';
        chaser.style.top = chaserY + 'px';
        cursor.style.left = mouseX + 'px';
        cursor.style.top = mouseY + 'px';
        updateTimer();
        updateChaser();
    </script>
</body>
</html>
